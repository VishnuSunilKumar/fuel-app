<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><title>Fuel</title>
<style>
:root{--bg:#000000;--card:#111113;--line:#27272b;--tx:#f2f2f4;--mut:#8b8b95;--ac:#19BF19;--dim:#167d16}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding-bottom:130px}
main{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 16px}
h1{font-size:26px;margin:6px 0 14px}h2{font-size:17px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mut{color:var(--mut);font-size:13px}.ac{color:var(--ac)}
button{background:var(--ac);color:#000;border:0;border-radius:14px;padding:12px 16px;font:600 14px system-ui;cursor:pointer}
button.g{background:#242428;color:var(--tx)}button.sm{padding:6px 12px;font-size:13px}button:disabled{opacity:.5}
input,select,textarea{width:100%;background:#0b0b0d;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px;font:15px system-ui;margin-top:4px}
label{font-size:12px;color:var(--mut);display:block;margin-top:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin:10px 0}
.week div{padding:4px 0;color:var(--mut);font-size:13px}.week b{display:flex;margin:4px auto 0;width:40px;height:40px;border-radius:50%;align-items:center;justify-content:center;color:var(--tx);font-size:17px}
.week .on b{background:var(--ac);color:#000}.week .on{color:var(--ac)}.week i{display:block;width:5px;height:5px;border-radius:50%;background:var(--ac);margin:3px auto 0}
.mac{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:6px}
.mac .t{height:84px;width:26px;margin:6px auto;background:#142014;border-radius:14px;display:flex;align-items:flex-end;overflow:hidden}
.mac .t i{display:block;width:100%;background:linear-gradient(#39e879,var(--ac));border-radius:14px}
.meal{display:flex;gap:12px;align-items:center}.meal img,.meal .ph{width:54px;height:54px;border-radius:14px;object-fit:cover;background:#202024;display:flex;align-items:center;justify-content:center}
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:496px;margin:auto;display:flex;background:#171719ee;backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:32px;padding:6px;z-index:5}
nav a{flex:1;text-align:center;padding:8px 0;border-radius:26px;color:var(--mut);font-size:11px;font-weight:600}nav a span{display:block;font-size:19px;height:22px}nav a.on{background:#29292d;color:var(--ac)}
.fab{position:fixed;right:max(20px,calc(50% - 240px));bottom:calc(98px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;font-size:30px;padding:0;z-index:5;box-shadow:0 6px 20px #19bf1940}
.sheet{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;z-index:9}
.sheet>div{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px;max-height:92vh;overflow:auto}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.c2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cg div{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;background:#222225}.cg small{font-size:8px;color:var(--mut)}.cg .l{background:var(--dim)}.cg .s{background:var(--ac);color:#000}.cg .s small{color:#000}
.b{padding:10px 12px;border-radius:16px;margin:6px 0;max-width:88%;white-space:pre-wrap}.b.u{background:var(--ac);color:#000;margin-left:auto}.b.a{background:#26262c}
.seg{display:flex;background:#0b0b0d;border-radius:14px;padding:3px}.seg a{flex:1;text-align:center;padding:8px;border-radius:11px;color:var(--mut);font-size:13px;font-weight:600}.seg a.on{background:#2e2e32;color:var(--tx)}
.ico{width:20px;height:20px;display:inline-block;vertical-align:middle;flex:none}.ico.sm{width:17px;height:17px}.ico.lg{width:24px;height:24px}
</style></head><body><main id="app"></main><div id="fabw"></div>
<nav id="nav"><a data-v="home"><span id="nav-home"></span>Home</a><a data-v="prog"><span id="nav-prog"></span>Progress</a><a data-v="coach"><span id="nav-coach"></span>Coach</a><a data-v="set"><span id="nav-set"></span>Settings</a><a data-v="work"><span id="nav-work"></span>Workouts</a></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICONS={
 home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 chart:'<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-5 5"/>',
 message:'<path d="M21 11.5a8.5 8.5 0 0 1-12.9 7.3L3 21l2.2-5.1A8.5 8.5 0 1 1 21 11.5Z"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.5.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.5-.9l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.8l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.5-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.5.9l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.8Z"/>',
 dumbbell:'<path d="m6.5 6.5 11 11M4 9l5-5m6 16 5-5M2 7l5-5m10 20 5-5M2 12l3-3m14 14 3-3"/>',
 sunrise:'<path d="M12 2v7m-7-2 2 2m10-2-2 2M2 18h20M4 14a8 8 0 0 1 16 0"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>',
 apple:'<path d="M12 7c-2-3-6-2-7 1-2 6 2 13 7 13s9-7 7-13c-1-3-5-4-7-1Z"/><path d="M12 7c0-3 2-5 5-5"/>',
 moon:'<path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/>',
 flame:'<path d="M12 22c4 0 7-3 7-7 0-3-2-5-4-8 0 3-2 4-2 4 0-4-2-7-5-9 1 5-3 7-3 13 0 4 3 7 7 7Z"/><path d="M12 22c-2 0-3-2-3-4 0-2 2-4 3-5 1 2 3 3 3 5s-1 4-3 4Z"/>',
 footsteps:'<ellipse cx="8" cy="7" rx="3" ry="5" transform="rotate(-20 8 7)"/><ellipse cx="17" cy="17" rx="3" ry="5" transform="rotate(-20 17 17)"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
 utensils:'<path d="M7 2v8m-4-8v5a4 4 0 0 0 8 0V2M7 11v11m10-20v20m0-20c3 3 4 7 0 10"/>'
};
function ico(n,cls=''){return `<svg class="ico ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||ICONS.utensils}</svg>`}
document.querySelectorAll('#nav a').forEach(a=>{const n={home:'home',prog:'chart',coach:'message',set:'settings',work:'dumbbell'}[a.dataset.v];a.querySelector('span').innerHTML=ico(n,'lg')});
let db;try{db=JSON.parse(localStorage.fuel)}catch(e){}
db=db||{};db.profile=Object.assign({sex:'m',age:25,h:170,w:70,goal:0,goalW:0},db.profile);db.days=db.days||{};db.weights=db.weights||{};
db.cfg=Object.assign({key:'',model:'gemini-3.5-flash',fb:true,model2:'gemini-3.5-flash-lite'},db.cfg);
const save=()=>{try{localStorage.fuel=JSON.stringify(db)}catch(e){alert('Storage full — export a backup.')}};
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const D=k=>new Date(k+'T12:00');
let view='home',cur=key(new Date()),cm=new Date(),range=30,chat=[];cm.setDate(1);
const day=k=>{const d=db.days[k]||(db.days[k]={});d.meals=d.meals||[];d.burn=d.burn||{kcal:0,steps:0};d.workouts=d.workouts||[];return d};
const MEALS=['Breakfast','Lunch','Snack','Dinner'],ICON={Breakfast:ico('sunrise'),Lunch:ico('sun'),Snack:ico('apple'),Dinner:ico('moon')};
function calc(){const p=db.profile,bmr=10*p.w+6.25*p.h-5*p.age+(p.sex=='m'?5:-161),t=Math.round(bmr*1.2+(+p.goal)),fat=Math.round(t*.25/9),pro=Math.round(1.6*p.w);
 return{bmr:Math.round(bmr),t,pro,fat,carb:Math.max(0,Math.round((t-pro*4-fat*9)/4)),fib:25}}
const sum=d=>d.meals.reduce((a,m)=>({k:a.k+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f,b:a.b+(m.fb||0)}),{k:0,p:0,c:0,f:0,b:0});
const burned=d=>d.workouts.reduce((a,w)=>a+w.kcal,0)+(+d.burn.kcal||0);
const pct=(a,b)=>Math.max(0,Math.min(100,b?a/b*100:0));
function render(){document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==view));
 $('#app').innerHTML=({home,prog,coach,set,work})[view]();
 $('#fabw').innerHTML=(view=='home'||view=='work')?`<button class="fab" onclick="${view=='home'?'addMeal()':'addWork()'}">${ico('plus','lg')}</button>`:'';
 if(view=='coach')scrollTo(0,document.body.scrollHeight);else if(!keep)scrollTo(0,0);keep=0}
let keep=0;
function gauge(r){let s='';for(let i=0;i<36;i++){const a=Math.PI+Math.PI*i/35,x=n=>150+n*Math.cos(a),y=n=>150+n*Math.sin(a);
 s+=`<line x1="${x(104)}" y1="${y(104)}" x2="${x(130)}" y2="${y(130)}" stroke="${i/35<=r&&r>0?'#19BF19':'#183018'}" stroke-width="7" stroke-linecap="round"/>`}return s}
function home(){const d=day(cur),s=sum(d),c=calc(),b=burned(d),left=c.t+b-s.k,dt=D(cur),mon=new Date(dt);mon.setDate(dt.getDate()-((dt.getDay()+6)%7));
 let wk='';for(let i=0;i<7;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);const k=key(x),has=db.days[k]&&db.days[k].meals.length;
  wk+=`<div class="${k==cur?'on':''}" onclick="cur='${k}';render()">${'MTWTFSS'[i]}<b>${x.getDate()}</b>${has?'<i></i>':''}</div>`}
 const mac=(n,v,t)=>`<div><b class="ac">${Math.round(v)}</b><div class="t"><i style="height:${Math.max(8,pct(v,t))}%"></i></div><b style="font-size:13px">${n}</b><div class="mut">${Math.abs(Math.round(t-v))}g ${t>=v?'left':'over'}</div></div>`;
 return `<div class="row"><button class="g sm" onclick="calSheet()">${ico('calendar','sm')} ${dt.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}</button><button class="g sm" onclick="cur=key(new Date());render()">Today</button></div>
<div class="week">${wk}</div>
<div style="text-align:center"><svg viewBox="0 20 300 140" style="width:100%;max-width:340px">${gauge(s.k/(c.t+b))}<text x="150" y="82" text-anchor="middle" fill="#8b8b95" font-size="13" font-weight="600">CALORIES</text><text x="150" y="128" text-anchor="middle" fill="#19BF19" font-size="46" font-weight="700">${Math.round(s.k)}</text></svg>
<div class="ac" style="font-weight:600;margin-top:-6px">${ico('flame','sm')} ${Math.abs(Math.round(left))} ${left>=0?'left':'over'}</div><div class="mut">${Math.round(c.t)} goal · ${Math.round(b)} burned</div><div class="mut" style="margin-top:6px">${ico('footsteps','sm')} ${d.burn.steps||0} steps</div></div>
<div class="mac" style="margin-top:14px">${mac('Protein',s.p,c.pro)}${mac('Carbs',s.c,c.carb)}${mac('Fat',s.f,c.fat)}${mac('Fiber',s.b,c.fib)}</div>
${MEALS.map(t=>{const ms=d.meals.filter(m=>m.type==t);if(!ms.length)return'';const k=ms.reduce((a,m)=>a+m.kcal,0);
 return `<h2>${ICON[t]} ${t}</h2><div class="ac" style="font-weight:600">${Math.round(k)} kcal</div>${ms.map(m=>`<div class="card meal" onclick="editMeal('${m.id}')">${m.img?`<img src="${m.img}">`:`<div class="ph">${ico('utensils','lg')}</div>`}<div style="flex:1"><div>${esc(m.name)}</div><div class="ac" style="font-weight:600">${m.kcal} kcal</div><div class="mut">P ${m.p} · C ${m.c} · F ${m.f}${m.fb?' · Fi '+m.fb:''}</div></div></div>`}).join('')}`}).join('')||'<p class="mut" style="text-align:center;margin-top:30px">Nothing logged yet. Tap + to add a meal.</p>'}`}
function calSheet(){const y=cm.getFullYear(),m=cm.getMonth(),f=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();let h='';for(let i=0;i<f;i++)h+='<span></span>';
 for(let i=1;i<=n;i++){const k=key(new Date(y,m,i)),d=db.days[k],kc=d?Math.round(sum(d).k):0;h+=`<div class="${kc?'l':''} ${k==cur?'s':''}" onclick="cur='${k}';closeSheet();render()">${i}<small>${kc||''}</small></div>`}
 openSheet(`<div class="row"><button class="g sm" onclick="cm.setMonth(cm.getMonth()-1);calSheet()">‹</button><b>${cm.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="g sm" onclick="cm.setMonth(cm.getMonth()+1);calSheet()">›</button></div><div class="cg" style="margin-top:12px">${h}</div><p class="mut">Numbers are kcal eaten.</p>`)}
function openSheet(h){closeSheet();const e=document.createElement('div');e.className='sheet';e.id='sh';e.innerHTML=`<div>${h}</div>`;e.onclick=ev=>{if(ev.target==e)closeSheet()};document.body.appendChild(e)}
const closeSheet=()=>$('#sh')?.remove();
/* AI */
async function ai(parts,json){const c=db.cfg;if(!c.key)throw Error('Add your Gemini API key in Settings');let err;const ms=[c.model].concat(c.fb&&c.model2?[c.model2]:[]);
 for(const m of ms){for(let i=0;i<3;i++){try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':c.key},body:JSON.stringify({contents:[{parts}],generationConfig:json?{responseMimeType:'application/json'}:{}})});
  const j=await r.json();if(r.ok)return j.candidates[0].content.parts.map(p=>p.text||'').join('');err=Error(j.error?.message||r.status);if(![429,500,503].includes(r.status))break}catch(e){err=e}await new Promise(s=>setTimeout(s,1200*(i+1)))}}throw err}
/* meals */
let dr;
function addMeal(t){const h=new Date().getHours();dr={id:'m'+Date.now(),type:t||(h<11?'Breakfast':h<16?'Lunch':h<19?'Snack':'Dinner'),name:'',kcal:0,p:0,c:0,f:0,fb:0,img:'',note:'',_new:1};mealSheet()}
function editMeal(id){dr={...day(cur).meals.find(m=>m.id==id)};mealSheet()}
function mealSheet(){const n=(l,k)=>`<div><label>${l}</label><input type="number" inputmode="decimal" id="f_${k}" value="${dr[k]||0}"></div>`;
 openSheet(`<div class="row"><select id="f_type" style="width:auto;margin:0">${MEALS.map(t=>`<option ${t==dr.type?'selected':''}>${t}</option>`).join('')}</select><button class="g sm" onclick="closeSheet()">Close</button></div>
<label>Photo (optional)</label><input type="file" accept="image/*" onchange="pick(this.files[0])"><div id="prev">${dr.img?`<img src="${dr.img}" style="width:100%;border-radius:14px;margin-top:8px">`:''}</div>
<label>Description (optional)</label><textarea id="note" rows="2" placeholder="e.g. 2 rotis, dal, 150g chicken curry">${esc(dr.note)}</textarea>
<button style="width:100%;margin-top:12px" onclick="analyze()" id="ab">Analyze with AI</button><div class="mut" id="msg" style="margin-top:6px"></div>
<label>Name</label><input id="f_name" value="${esc(dr.name)}"><div class="cols">${n('kcal','kcal')}${n('Prot','p')}${n('Carb','c')}${n('Fat','f')}${n('Fiber','fb')}</div>
<div class="row" style="margin-top:14px"><button onclick="saveMeal()" style="flex:1">Save</button>${dr._new?'':`<button class="g" onclick="delMeal()">Delete</button>`}</div>`)}
function pick(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=w=>{const s=Math.min(1,w/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)};
 dr.big=sc(1024);dr.img=sc(240);$('#prev').innerHTML=`<img src="${dr.img}" style="width:100%;border-radius:14px;margin-top:8px">`};im.src=r.result};r.readAsDataURL(f)}
async function analyze(){const note=$('#note').value.trim(),m=$('#msg');dr.note=note;if(!dr.big&&!note)return m.textContent='Add a photo or a description.';
 $('#ab').disabled=true;m.textContent='Analyzing…';const parts=[{text:'You are a nutrition expert. Estimate the nutrition of this meal'+(note?` using this description: "${note}"`:'')+'. Estimate the full portion. Return JSON: {"name":string,"kcal":number,"protein":number,"carbs":number,"fat":number,"fiber":number}. Grams for macros.'}];
 if(dr.big)parts.push({inline_data:{mime_type:'image/jpeg',data:dr.big.split(',')[1]}});
 try{const o=JSON.parse((await ai(parts,1)).replace(/```json|```/g,''));const s=(k,v)=>$('#f_'+k).value=Math.round(v||0);$('#f_name').value=o.name||'';s('kcal',o.kcal);s('p',o.protein);s('c',o.carbs);s('f',o.fat);s('fb',o.fiber);m.textContent='Estimate filled in — adjust if needed.'}catch(e){m.textContent='Failed: '+e.message}$('#ab').disabled=false}
function saveMeal(){const g=k=>+$('#f_'+k).value||0,o={id:dr.id,type:$('#f_type').value,name:$('#f_name').value.trim()||'Meal',kcal:g('kcal'),p:g('p'),c:g('c'),f:g('f'),fb:g('fb'),img:dr.img,note:$('#note').value.trim()};
 const ms=day(cur).meals,i=ms.findIndex(m=>m.id==o.id);i<0?ms.push(o):ms[i]=o;save();closeSheet();render()}
function delMeal(){const d=day(cur);d.meals=d.meals.filter(m=>m.id!=dr.id);save();closeSheet();render()}
/* workouts */
const MET={Light:3,Moderate:5,Intense:8};
function work(){const d=day(cur),k=D(cur);return `<h1>Workouts</h1><div class="row"><button class="g sm" onclick="calSheet()">${ico('calendar','sm')} ${k.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}</button></div>
<div class="card c2" style="margin-top:12px"><div><div class="mut">Workouts</div><b style="font-size:26px;color:var(--ac)">${d.workouts.length}</b></div><div><div class="mut">Burn</div><b style="font-size:26px;color:var(--ac)">${Math.round(burned(d))} kcal</b></div></div>
<h2>Today</h2>${d.workouts.map(w=>`<div class="card row" onclick="editWork('${w.id}')"><div><b>${esc(w.name)}</b><div class="mut">${w.min} min · ${w.eff}</div></div><b class="ac">${w.kcal} kcal</b></div>`).join('')||'<p class="mut">No workouts yet. Tap +.</p>'}
<h2>Daily activity (from your watch)</h2><div class="card c2"><div><label style="margin:0">Steps</label><input type="number" inputmode="numeric" value="${d.burn.steps||''}" onchange="day(cur).burn.steps=+this.value||0;save();keep=1;render()"></div><div><label style="margin:0">Other active kcal</label><input type="number" inputmode="numeric" value="${d.burn.kcal||''}" onchange="day(cur).burn.kcal=+this.value||0;save();keep=1;render()"></div></div>`}
function addWork(){dr={id:'w'+Date.now(),name:'Walking',min:30,eff:'Light',kcal:0,_new:1};workSheet()}
function editWork(id){dr={...day(cur).workouts.find(w=>w.id==id)};workSheet()}
function workSheet(){openSheet(`<div class="row"><b>Workout</b><button class="g sm" onclick="closeSheet()">Close</button></div><label>Activity</label><input id="w_n" value="${esc(dr.name)}">
<div class="c2"><div><label>Minutes</label><input type="number" id="w_m" value="${dr.min}" oninput="wk()"></div><div><label>Effort</label><select id="w_e" onchange="wk()">${Object.keys(MET).map(e=>`<option ${e==dr.eff?'selected':''}>${e}</option>`).join('')}</select></div></div>
<label>Calories burned (auto-estimated, editable)</label><input type="number" id="w_k" value="${dr.kcal}"><div class="row" style="margin-top:14px"><button style="flex:1" onclick="saveWork()">Save</button>${dr._new?'':`<button class="g" onclick="delWork()">Delete</button>`}</div>`);if(dr._new)wk()}
function wk(){$('#w_k').value=Math.round(MET[$('#w_e').value]*db.profile.w*(+$('#w_m').value||0)/60)}
function saveWork(){const o={id:dr.id,name:$('#w_n').value.trim()||'Workout',min:+$('#w_m').value||0,eff:$('#w_e').value,kcal:+$('#w_k').value||0},ws=day(cur).workouts,i=ws.findIndex(w=>w.id==o.id);i<0?ws.push(o):ws[i]=o;save();closeSheet();render()}
function delWork(){const d=day(cur);d.workouts=d.workouts.filter(w=>w.id!=dr.id);save();closeSheet();render()}
/* progress */
function prog(){const p=db.profile,pts=Object.entries(db.weights).sort(),since=new Date();since.setDate(since.getDate()-range);const v=pts.filter(x=>range==0||D(x[0])>=since),ws=v.map(x=>x[1]);
 const avg=ws.length?(ws.reduce((a,b)=>a+b,0)/ws.length).toFixed(1):'–',net=ws.length>1?(ws[ws.length-1]-ws[0]).toFixed(1):'0.0';
 let ch='<p class="mut" style="text-align:center;padding:30px 0">Log at least 2 weights to see the chart.</p>';
 if(ws.length>1){const lo=Math.min(...ws,p.goalW||1e9)-1,hi=Math.max(...ws,p.goalW||0)+1,X=i=>10+i*(300/(ws.length-1)),Y=w=>130-(w-lo)/(hi-lo)*120;
  ch=`<svg viewBox="0 0 320 140" style="width:100%"><polyline fill="none" stroke="#19BF19" stroke-width="3" stroke-linejoin="round" points="${ws.map((w,i)=>X(i)+','+Y(w)).join(' ')}"/>${ws.map((w,i)=>`<circle cx="${X(i)}" cy="${Y(w)}" r="3.5" fill="#19BF19"/>`).join('')}${p.goalW?`<line x1="10" x2="310" y1="${Y(p.goalW)}" y2="${Y(p.goalW)}" stroke="#8b8b95" stroke-dasharray="4"/>`:''}</svg>`}
 const st=(a,b)=>`<div style="text-align:center"><b style="font-size:17px">${a}</b><div class="mut">${b}</div></div>`;
 return `<h1>My Progress</h1><div class="seg">${[[7,'1W'],[30,'1M'],[90,'3M'],[365,'1Y'],[0,'All']].map(r=>`<a class="${range==r[0]?'on':''}" onclick="range=${r[0]};render()">${r[1]}</a>`).join('')}</div>
<div class="card" style="margin-top:14px"><div class="row"><b style="font-size:18px">Weight</b><button class="g sm ac" onclick="logW()">+ Log weight</button></div>
<div class="cols" style="grid-template-columns:repeat(4,1fr);margin:12px 0">${st(p.w+' kg','Current')}${st((p.goalW||'–')+' kg','Goal')}${st(net+' kg','Net change')}${st(avg+' kg','Average')}</div>${ch}</div>
<div class="card"><b>Last 7 days</b>${[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-6+i);const k=key(x),d=db.days[k],kc=d?Math.round(sum(d).k):0;return `<div class="row" style="margin-top:8px"><span class="mut" style="width:44px">${x.toLocaleDateString(undefined,{weekday:'short'})}</span><div class="bar" style="flex:1;height:8px;background:#142014;border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:${pct(kc,calc().t)}%;background:var(--ac)"></i></div><span style="width:56px;text-align:right">${kc}</span></div>`}).join('')}</div>`}
function logW(){openSheet(`<b>Log weight</b><label>Weight (kg)</label><input type="number" inputmode="decimal" id="lw" value="${db.profile.w}"><button style="width:100%;margin-top:14px" onclick="const v=+$('#lw').value;if(v>0){db.weights[key(new Date())]=v;db.profile.w=v;save();closeSheet();render()}">Save</button>`)}
/* coach */
function coach(){return `<h1>Coach</h1>${chat.map(m=>`<div class="b ${m.r}">${esc(m.t)}</div>`).join('')||'<p class="mut">Ask about your meals, calories, or what to eat next. I can see today\'s totals and your goals.</p>'}
<div class="row" style="margin-top:12px"><input id="cq" placeholder="Ask your coach…" onkeydown="if(event.key=='Enter')ask()"><button onclick="ask()" id="cb">Send</button></div>`}
async function ask(){const q=$('#cq').value.trim();if(!q)return;chat.push({r:'u',t:q});chat.push({r:'a',t:'…'});render();const c=calc(),s=sum(day(key(new Date())));
 const ctx=`You are a concise, friendly nutrition and fitness coach. User: ${db.profile.sex=='m'?'male':'female'}, ${db.profile.age}y, ${db.profile.h}cm, ${db.profile.w}kg, goal weight ${db.profile.goalW||'n/a'}kg. Daily target ${c.t} kcal. Eaten today: ${Math.round(s.k)} kcal, P${Math.round(s.p)} C${Math.round(s.c)} F${Math.round(s.f)}. Keep answers short.\n`+chat.slice(0,-1).slice(-8).map(m=>(m.r=='u'?'User: ':'Coach: ')+m.t).join('\n');
 try{chat[chat.length-1].t=(await ai([{text:ctx}])).trim()}catch(e){chat[chat.length-1].t='Failed: '+e.message}render()}
/* settings */
function set(){const p=db.profile,c=calc(),cf=db.cfg,f=(l,k,t='number')=>`<label>${l}</label><input type="${t}" inputmode="decimal" value="${p[k]}" onchange="db.profile.${k}=+this.value;save();keep=1;render()">`;
 return `<h1>Settings</h1><h2>Personal info</h2><div class="card"><label style="margin:0">Sex</label><select onchange="db.profile.sex=this.value;save();keep=1;render()"><option value="m" ${p.sex=='m'?'selected':''}>Male</option><option value="f" ${p.sex=='f'?'selected':''}>Female</option></select>${f('Age','age')}${f('Height (cm)','h')}${f('Weight (kg)','w')}</div>
<h2>Goals & nutrition</h2><div class="card"><label style="margin:0">Goal</label><select onchange="db.profile.goal=+this.value;save();keep=1;render()">${[[-500,'Lose weight (−500 kcal)'],[0,'Maintain'],[300,'Gain (+300 kcal)']].map(o=>`<option value="${o[0]}" ${p.goal==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>${f('Goal weight (kg)','goalW')}
<div class="ac" style="font-size:28px;font-weight:700;margin-top:12px">${c.t} kcal</div><div class="mut">BMR ${c.bmr} · Protein ${c.pro}g · Carbs ${c.carb}g · Fat ${c.fat}g<br>Base = BMR × 1.2; workouts and active calories are added on top.</div></div>
<h2>AI providers & fallback</h2><div class="card"><label style="margin:0">Gemini API key (stored only on this device)</label><input type="password" value="${esc(cf.key)}" onchange="db.cfg.key=this.value.trim();save()"><label>Primary model</label><input value="${esc(cf.model)}" onchange="db.cfg.model=this.value.trim();save()">
<label>Fallback model (used if primary is busy or fails)</label><input value="${esc(cf.model2)}" onchange="db.cfg.model2=this.value.trim();save()"><label class="row" style="margin-top:12px"><span>Enable fallback</span><input type="checkbox" style="width:auto" ${cf.fb?'checked':''} onchange="db.cfg.fb=this.checked;save()"></label></div>
<h2>Health & data</h2><div class="card mut">Huawei Health can't be read from a web app, so enter steps and active calories under Workouts.</div>
<div class="card row"><button class="g" onclick="exp()">Export backup</button><label style="margin:0"><span class="g" style="display:inline-block;padding:12px 16px;border-radius:14px;color:var(--tx);font-weight:600;font-size:14px">Import</span><input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label></div>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='fuel-backup-'+key(new Date())+'.json';a.click()}
function imp(f){if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.days)throw 0;localStorage.fuel=t;location.reload()}catch(e){alert('Invalid file')}})}
document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>{view=a.dataset.v;render()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
