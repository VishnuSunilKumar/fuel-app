<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161617"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><title>Fuel</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#161617;--card:#232325;--line:#333336;--tx:#f4f4f2;--mut:#9a9a9f;--lime:#e4f58b;--lav:#b3a1ff;--pk:#f0c6f7;--ink:#141414}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px Lexend,system-ui,sans-serif;padding-bottom:140px}
main{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 16px}
h1{font-size:26px;font-weight:400;margin:4px 0 12px}h2{font-size:18px;font-weight:400;margin:22px 0 10px}
.card{background:var(--card);border-radius:24px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mut{color:var(--mut);font-size:13px}
button{background:var(--lime);color:var(--ink);border:0;border-radius:999px;padding:12px 18px;font:600 14px Lexend,system-ui;cursor:pointer}
button.g{background:#2e2e31;color:var(--tx)}button.w{background:#fff}button.sm{padding:7px 14px;font-size:13px}button:disabled{opacity:.5}
input,select,textarea{width:100%;background:#161617;color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:12px;font:15px Lexend,system-ui;margin-top:4px}
label{font-size:12px;color:var(--mut);display:block;margin-top:12px}
.pill{display:flex;background:#fff;border-radius:999px;padding:4px;gap:2px}.pill button{background:none;padding:6px 12px;font-size:18px;color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin:14px 0;color:var(--mut)}
.week b{display:flex;margin:6px auto 0;width:38px;height:38px;border-radius:50%;align-items:center;justify-content:center;color:var(--tx);font-weight:400}
.week .on b{background:var(--lime);color:var(--ink)}.week .on{color:var(--tx)}.week i{display:block;width:5px;height:5px;border-radius:50%;background:var(--lav);margin:3px auto 0}
.hero{background:var(--lime);color:var(--ink);border-radius:26px;padding:18px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-50px;top:-30px;width:190px;height:190px;border-radius:50%;box-shadow:0 0 0 18px #0001,0 0 0 40px #0001,0 0 0 62px #0000000a}
.hero>*{position:relative;z-index:1}
.chips{display:flex;gap:8px;overflow-x:auto;margin:16px 0;padding:4px;background:#232325;border-radius:999px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips a{padding:9px 16px;border-radius:999px;color:var(--mut);font-size:14px;white-space:nowrap}.chips a.on{background:#fff;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:24px;padding:16px;color:var(--ink);min-height:128px;position:relative}
.tile.pk{background:var(--pk)}.tile.lv{background:var(--lav)}
.big{font-size:28px;font-weight:600;line-height:1.1}
.mc{border-radius:26px;padding:16px;margin-bottom:12px;color:var(--ink);position:relative;display:flex;gap:14px;align-items:center;min-height:110px}
.mc.pk{background:var(--pk)}.mc.lv{background:var(--lav)}
.mc .im{width:80px;height:80px;border-radius:20px;object-fit:cover;background:#ffffff66;display:flex;align-items:center;justify-content:center;font-size:34px;flex:none}
.bd{position:absolute;right:-2px;top:-2px;background:#fff;border:6px solid var(--bg);border-radius:50%;width:66px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:600;line-height:1}.bd small{font-size:10px;font-weight:400}
.tag{display:inline-block;background:#ffffff80;border-radius:999px;padding:3px 10px;font-size:11px;margin:6px 4px 0 0}
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:496px;margin:auto;display:flex;justify-content:space-between;background:#232325;border:1px solid #333336;border-radius:999px;padding:8px 10px;z-index:5;box-shadow:0 8px 30px #000a}
nav a{width:54px;height:54px;border-radius:50%;background:#2e2e31;display:flex;align-items:center;justify-content:center;color:#9a9a9f}
nav a.on{background:var(--lav);color:var(--ink)}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(100px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;font-size:32px;padding:0;z-index:5;box-shadow:0 6px 20px #e4f58b44}
.sheet{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;z-index:9}
.sheet>div{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:28px 28px 0 0;padding:18px;max-height:92vh;overflow:auto}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.c2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cg div{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;background:#2e2e31}.cg small{font-size:8px;color:var(--mut)}.cg .l{background:#3a3560}.cg .s{background:var(--lime);color:var(--ink)}.cg .s small{color:var(--ink)}
.b{padding:10px 14px;border-radius:18px;margin:6px 0;max-width:88%;white-space:pre-wrap}.b.u{background:var(--lime);color:var(--ink);margin-left:auto}.b.a{background:#2e2e31}
.li{display:flex;justify-content:space-between;align-items:center;padding:16px;background:var(--card);border-radius:20px;margin-bottom:10px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}.im .ic{width:34px;height:34px;stroke:#141414}
.xc{background:var(--card);border-radius:22px;padding:12px;margin-bottom:10px}.xc.dn{background:#2a2744}
.xi{width:88px;height:88px;border-radius:16px;background:#fff;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:#555}
.ck{width:38px;height:38px;border-radius:50%;border:2px solid var(--lav);background:none;padding:0;color:var(--ink);flex:none;display:flex;align-items:center;justify-content:center}.ck.on{background:var(--lime);border-color:var(--lime)}
.xc input{padding:8px;font-size:14px;margin-top:2px}.xc label{margin-top:8px;font-size:11px}
.bar{height:8px;background:#2e2e31;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--lime)}
</style></head><body><main id="app"></main><div id="fabw"></div>
<nav id="nav"></nav>
<script>
const I={cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',plate:'<path d="M7 3v7a2 2 0 0 0 4 0V3M9 3v18M17 3c-2.5 2-3 5-3 8h3v10"/>',spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',bell:'<path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/>',bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13v2M15 13v2"/>',disk:'<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',check:'<path d="M5 12l5 5 9-10"/>',chev:'<path d="M9 6l6 6-6 6"/>',dumb:'<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',moon:'<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/>'};
const ic=(n,st='')=>`<svg class="ic" viewBox="0 0 24 24" style="${st}">${I[n]}</svg>`;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db;try{db=JSON.parse(localStorage.fuel)}catch(e){}
db=db||{};db.profile=Object.assign({sex:'m',age:25,h:170,w:70,goal:0,goalW:0,bday:'',bf:'',waterGoal:0},db.profile);db.days=db.days||{};db.weights=db.weights||{};
db.cfg=Object.assign({prov:'gemini',key:'',base:'https://api.openai.com/v1',model:'gemini-3.5-flash',fb:true,fbk:'cloud',model2:'gemini-3.5-flash-lite',maxTok:2048,pipe:true,vBase:'',vModel:'',vKey:'',insight:'device',mUrl:'https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it-web.task'},db.cfg);
db.notif=Object.assign({on:false,every:90,from:8,to:22,cup:250},db.notif);
const save=()=>{try{localStorage.fuel=JSON.stringify(db)}catch(e){alert('Storage full — export a backup.')}};
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),D=k=>new Date(k+'T12:00');
let view='home',sub='',cur=key(new Date()),cm=new Date(),range=30,chat=[],flt='All',keep=0,dr;cm.setDate(1);
const day=k=>{const d=db.days[k]||(db.days[k]={});d.meals=d.meals||[];d.burn=d.burn||{kcal:0,steps:0};d.workouts=d.workouts||[];d.water=d.water||0;d.gym=d.gym||{};return d};
const MEALS=['Breakfast','Lunch','Snack','Dinner'];
const age=()=>{const p=db.profile;if(!p.bday)return p.age;const b=new Date(p.bday),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const wGoal=()=>db.profile.waterGoal||Math.round(db.profile.w*35/250)*250;
function calc(){const p=db.profile,bmr=+p.bf>0?370+21.6*p.w*(1-p.bf/100):10*p.w+6.25*p.h-5*age()+(p.sex=='m'?5:-161),t=Math.round(bmr*1.2+(+p.goal)),fat=Math.round(t*.25/9),pro=Math.round(1.6*p.w);
 return{bmr:Math.round(bmr),t,pro,fat,carb:Math.max(0,Math.round((t-pro*4-fat*9)/4)),fib:25}}
const sum=d=>d.meals.reduce((a,m)=>({k:a.k+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{k:0,p:0,c:0,f:0});
const burned=d=>d.workouts.reduce((a,w)=>a+w.kcal,0)+(+d.burn.kcal||0)+gymK(d);
const pct=(a,b)=>Math.max(0,Math.min(100,b?a/b*100:0));
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',prog:'<path d="M6 20V10M12 20V4M18 20v-7"/>',work:'<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',coach:'<path d="M4 5h16v11H9l-5 4z"/>',set:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>'};
$('#nav').innerHTML=Object.keys(IC).map(k=>`<a data-v="${k}"><svg viewBox="0 0 24 24">${IC[k]}</svg></a>`).join('');
function render(){document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==view));
 $('#app').innerHTML=({home,prog,coach,set,work})[view]();
 $('#fabw').innerHTML=(view=='home'||view=='work')?`<button class="fab" onclick="${view=='home'?'addMeal()':'addWork()'}">+</button>`:'';
 if(view=='coach')scrollTo(0,document.body.scrollHeight);else if(!keep)scrollTo(0,0);keep=0}
/* HOME */
function shiftWk(n){const d=D(cur);d.setDate(d.getDate()+n);cur=key(d);render()}
function donut(s){const v=[s.p*4,s.c*4,s.f*9],t=v[0]+v[1]+v[2],col=['#e4f58b','#b3a1ff','#f0c6f7'];let o=0,h='<circle cx="60" cy="60" r="40" fill="none" stroke="#2e2e31" stroke-width="22"/>';
 if(t)v.forEach((x,i)=>{const l=x/t*251.3;h+=`<circle cx="60" cy="60" r="40" fill="none" stroke="${col[i]}" stroke-width="22" stroke-dasharray="${l} ${251.3-l}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=l});return `<svg viewBox="0 0 120 120" style="width:130px">${h}</svg>`}
function home(){const d=day(cur),s=sum(d),c=calc(),b=burned(d),left=c.t+b-s.k,dt=D(cur),mon=new Date(dt);mon.setDate(dt.getDate()-((dt.getDay()+6)%7));
 let wk='';for(let i=0;i<7;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);const k=key(x),has=db.days[k]&&db.days[k].meals.length;wk+=`<div class="${k==cur?'on':''}" onclick="cur='${k}';render()">${'MTWTFSS'[i]}<b>${x.getDate()}</b>${has?'<i></i>':''}</div>`}
 const ms=d.meals.filter(m=>flt=='All'||m.type==flt).sort((a,b)=>MEALS.indexOf(a.type)-MEALS.indexOf(b.type)),wg=wGoal(),pc=Math.round(pct(s.k,c.t+b));
 return `<div class="row"><h1>Your Nutrition</h1><button class="g sm" onclick="calSheet()">${ic('cal')}</button></div>
<div class="row"><span style="font-size:20px">${dt.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</span><div class="pill"><button onclick="shiftWk(-7)">‹</button><button onclick="shiftWk(7)">›</button></div></div>
<div class="week">${wk}</div>
<div class="hero"><div style="font-size:20px">${cur==key(new Date())?"Today's Goal":dt.toLocaleDateString(undefined,{weekday:'long'})}</div><div class="big" style="margin:8px 0 4px">${Math.abs(Math.round(left))} kcal ${left>=0?'left':'over'}</div><div style="font-size:13px">${Math.round(s.k)} eaten · ${c.t} goal · ${Math.round(b)} burned</div></div>
<div class="chips">${['All',...MEALS].map(t=>`<a class="${flt==t?'on':''}" onclick="flt='${t}';keep=1;render()">${t}</a>`).join('')}</div>
<div class="two"><div class="tile pk" onclick="waterSheet()"><div class="row"><b style="font-weight:400;font-size:18px">Water</b><span style="font-size:22px">${ic('drop')}</span></div><div class="big" style="margin-top:16px">${d.water}<span style="font-size:14px"> ml</span></div><div style="font-size:12px">of ${wg} ml</div><div class="bar" style="margin-top:8px;background:#fff8"><i style="width:${pct(d.water,wg)}%;background:var(--ink)"></i></div></div>
<div class="tile lv"><b style="font-weight:400;font-size:18px">My Goals</b><div style="font-size:12px;margin-top:6px">Keep it up, you can reach your goal.</div><div style="background:#fff8;border-radius:999px;margin-top:14px;padding:3px"><div style="background:#fff;border-radius:999px;padding:4px 0;text-align:center;font-size:12px;width:${Math.max(pc,22)}%">${pc}%</div></div></div></div>
<div class="card" style="margin-top:12px"><div class="row"><div style="font-size:14px;line-height:2.1"><span style="color:var(--lime)">●</span> ${c.t} kcal<div class="mut" style="margin:-8px 0 0 16px">Target</div><span style="color:var(--lav)">●</span> ${Math.round(s.k)} kcal<div class="mut" style="margin:-8px 0 0 16px">Eaten</div><span style="color:var(--pk)">●</span> ${Math.round(b)} kcal<div class="mut" style="margin:-8px 0 0 16px">Burned</div></div>${donut(s)}</div>
<div class="mut" style="margin-top:10px"><span style="color:var(--lime)">●</span> Protein ${Math.round(s.p)}/${c.pro}g &nbsp;<span style="color:var(--lav)">●</span> Carbs ${Math.round(s.c)}/${c.carb}g &nbsp;<span style="color:var(--pk)">●</span> Fat ${Math.round(s.f)}/${c.fat}g</div></div>
<h2>Meals</h2>${ms.map((m,i)=>`<div class="mc ${i%2?'pk':'lv'}" onclick="editMeal('${m.id}')"><div class="bd">${m.kcal}<small>kcal</small></div>${m.img?`<img class="im" src="${m.img}">`:`<div class="im">${ic('plate')}</div>`}<div style="padding-right:48px"><div style="font-size:17px;line-height:1.25">${esc(m.name)}</div><span class="tag">${m.type}</span><span class="tag">P ${m.p}</span><span class="tag">C ${m.c}</span><span class="tag">F ${m.f}</span>${m.fb?`<span class="tag">Fi ${m.fb}</span>`:''}</div></div>`).join('')||'<p class="mut" style="text-align:center;margin:30px 0">Nothing logged. Tap + to add a meal.</p>'}`}
function calSheet(){const y=cm.getFullYear(),m=cm.getMonth(),f=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();let h='';for(let i=0;i<f;i++)h+='<span></span>';
 for(let i=1;i<=n;i++){const k=key(new Date(y,m,i)),d=db.days[k],kc=d?Math.round(sum(d).k):0;h+=`<div class="${kc?'l':''} ${k==cur?'s':''}" onclick="cur='${k}';view='home';closeSheet();render()">${i}<small>${kc||''}</small></div>`}
 openSheet(`<div class="row"><button class="g sm" onclick="cm.setMonth(cm.getMonth()-1);calSheet()">‹</button><b style="font-weight:400">${cm.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="g sm" onclick="cm.setMonth(cm.getMonth()+1);calSheet()">›</button></div><div class="cg" style="margin-top:12px">${h}</div><p class="mut">Numbers are kcal eaten.</p>`)}
function openSheet(h){closeSheet();const e=document.createElement('div');e.className='sheet';e.id='sh';e.innerHTML=`<div>${h}</div>`;e.onclick=ev=>{if(ev.target==e)closeSheet()};document.body.appendChild(e)}
const closeSheet=()=>$('#sh')?.remove();
/* WATER */
function waterSheet(){const d=day(cur),wg=wGoal(),n=db.notif.cup;openSheet(`<div class="row"><b style="font-weight:400;font-size:20px">${ic('drop','color:var(--pk)')} Water</b><button class="g sm" onclick="closeSheet()">Close</button></div>
<div class="big" style="margin:16px 0 4px;color:var(--pk)">${d.water} <span style="font-size:15px">/ ${wg} ml</span></div><div class="bar"><i style="width:${pct(d.water,wg)}%;background:var(--pk)"></i></div>
<div class="two" style="margin-top:16px"><button onclick="addW(${n})">+ ${n} ml</button><button onclick="addW(500)">+ 500 ml</button><button class="g" onclick="addW(-${n})">− ${n} ml</button><button class="g" onclick="const v=+prompt('Amount in ml');if(v)addW(v)">Custom</button></div>`)}
function addW(n){const d=day(cur);d.water=Math.max(0,d.water+n);save();waterSheet();render()}
/* NOTIFICATIONS */
async function notify(t,b){try{const r=await navigator.serviceWorker.ready;r.showNotification(t,{body:b,icon:'icon-192.png',tag:'fuel-water'})}catch(e){new Notification(t,{body:b})}}
async function enableNotif(){if(!('Notification'in window))return alert('Notifications are not supported here.');const p=await Notification.requestPermission();if(p!='granted')return alert('Permission denied. Enable notifications for this site in Chrome settings.');
 db.notif.on=true;save();try{const r=await navigator.serviceWorker.ready;await r.periodicSync.register('fuel-water',{minInterval:60*60*1000})}catch(e){}notify('Fuel','Water reminders are on');render()}
function tick(){const n=db.notif;if(!n.on||!('Notification'in window)||Notification.permission!='granted')return;const h=new Date().getHours();if(h<n.from||h>=n.to)return;
 const last=+localStorage.fuelLast||0;if(Date.now()-last<n.every*60000)return;const d=day(key(new Date()));if(d.water>=wGoal())return;localStorage.fuelLast=Date.now();notify('Time to drink water',`You've had ${d.water} of ${wGoal()} ml today.`)}
setInterval(tick,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
/* AI */
const toB=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function callOne(a,parts,json){const c=db.cfg,mt=+c.maxTok||2048,txt=parts.filter(x=>x.text).map(x=>x.text).join('\n'),img=(parts.find(x=>x.img)||{}).img;
 if(a.k=='device')return device(txt);const K=a.key||c.key,B=a.base||c.base;if(!K)throw Error('Add your API key in Settings → AI');
 if(a.k=='openai'){const content=[{type:'text',text:txt}];if(img)content.push({type:'image_url',image_url:{url:img}});
  const r=await fetch(B.replace(/\/$/,'')+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+K},body:JSON.stringify({model:a.m,messages:[{role:'user',content}],max_tokens:mt})});const j=await r.json();
  if(!r.ok){const e=Error(j.error?.message||r.status);e.st=r.status;throw e}return j.choices[0].message.content}
 const g=[{text:txt}];if(img)g.push({inline_data:{mime_type:'image/jpeg',data:img.split(',')[1]}});
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${a.m}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':K},body:JSON.stringify({contents:[{parts:g}],generationConfig:Object.assign({maxOutputTokens:mt},json?{responseMimeType:'application/json'}:{})})});
 const j=await r.json();if(!r.ok){const e=Error(j.error?.message||r.status);e.st=r.status;throw e}return j.candidates[0].content.parts.map(p=>p.text||'').join('')}
async function ai(parts,json,first){const c=db.cfg,list=c.prov=='device'?[{k:'device'}]:[{k:c.prov,m:c.model}];
 if(c.fb)list.push(c.fbk=='device'||c.prov=='device'?(c.prov=='device'?{k:'gemini',m:c.model2}:{k:'device'}):{k:c.prov,m:c.model2});if(first)list.unshift(first);let err;
 for(const a of list){for(let i=0;i<(a.k=='device'?1:3);i++){try{return await callOne(a,parts,json)}catch(e){err=e;if(![429,500,503].includes(e.st))break;await new Promise(s=>setTimeout(s,1200*(i+1)))}}}throw err}
let llm,mp=0;
async function device(prompt){if(!llm){const c=await caches.open('fuel-model'),r=await c.match(db.cfg.mUrl);if(!r)throw Error('Download Gemma first (Settings → AI)');
 const {FilesetResolver,LlmInference}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai/+esm');const fs=await FilesetResolver.forGenAiTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai/wasm');
 llm=await LlmInference.createFromOptions(fs,{baseOptions:{modelAssetBuffer:r.body.getReader()},maxTokens:(+db.cfg.maxTok||1024)+1024,topK:40,temperature:.7})}
 return await llm.generateResponse(`<start_of_turn>user\n${prompt}<end_of_turn>\n<start_of_turn>model\n`)}
async function dlModel(){const u=db.cfg.mUrl;try{navigator.storage?.persist?.();const c=await caches.open('fuel-model'),r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);const tot=+r.headers.get('content-length')||2.1e9;let got=0;
 const ts=new TransformStream({transform(ch,ctl){got+=ch.length;mp=Math.round(got/tot*100);const e=$('#mp');if(e)e.textContent='Downloading · '+mp+'%';ctl.enqueue(ch)}});
 await c.put(u,new Response(r.body.pipeThrough(ts),{headers:{'content-type':'application/octet-stream'}}));db.cfg.mOk=1;save();render()}catch(e){alert('Download failed: '+e.message);const e2=$('#mp');if(e2)e2.textContent='Not downloaded'}}
async function delModel(){await caches.delete('fuel-model');llm=null;db.cfg.mOk=0;save();render()}

const IMC={};
async function wimg(q){const j=await(await fetch(`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=4&prop=pageimages&piprop=thumbnail&pithumbsize=240&format=json&origin=*`)).json();
 const p=Object.values(j.query?.pages||{}).sort((a,b)=>a.index-b.index).find(p=>p.thumbnail);if(!p)return'';return toB(await(await fetch(p.thumbnail.source)).blob())}
async function foodImg(name,term){const cl=s=>s.replace(/[\d.,]+\s*(g|kg|ml|l|oz|x|pcs?)?\b/gi,' ').replace(/\b(small|medium|large|big|mini|regular|a|an|the|of|with|and|plate|bowl|cup|glass|can|bottle|piece|pieces|slice|slices|portion|serving|homemade|grilled|fried)\b/gi,' ').replace(/\s+/g,' ').trim();
 const w=cl(name).split(' ').filter(Boolean),qs=[...new Set([term,cl(name),w[w.length-1],'Meal'].filter(Boolean))];
 for(const q of qs){if(IMC[q])return IMC[q];try{const i=await wimg(q);if(i)return IMC[q]=i}catch(e){}}return''}
async function ensureImg(m){if(m.img)return;const i=await foodImg(m.name,m.term);if(i){m.img=i;m.auto=1;save();if(view=='home')keep=1,render()}}

function pick(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=w=>{const s=Math.min(1,w/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)};
 dr.big=sc(1024);dr.img=sc(240);dr.auto=0;$('#prev').innerHTML=`<img src="${dr.img}" style="width:100%;border-radius:18px;margin-top:8px">`};im.src=r.result};r.readAsDataURL(f)}

function lookup(n){n=n.toLowerCase();const ns=n.replace(/s\b/g,'');let best,bl=0;for(const f of FD)for(const k of f.k)if((n.includes(k)||ns.includes(k)||k.includes(n))&&k.length>bl){best=f;bl=k.length}return best?best.v:null}
async function offLookup(q){try{const j=await(await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=3&fields=nutriments`)).json();const n=(j.products||[]).map(p=>p.nutriments||{}).find(n=>n['energy-kcal_100g']>0);return n?[n['energy-kcal_100g'],n.proteins_100g||0,n.carbohydrates_100g||0,n.fat_100g||0,n.fiber_100g||0,n.sugars_100g||0]:null}catch(e){return null}}
const visAgent=()=>db.cfg.vModel?{k:'openai',m:db.cfg.vModel,base:db.cfg.vBase,key:db.cfg.vKey}:null;
async function pipeline(note,m){const vf=visAgent(),parts=[{text:`You are the Food Vision agent. Identify every food and drink item${note?` (user description: "${note}")`:''}. Estimate each item's portion in grams (ml for drinks) and your confidence from 0 to 1. Reply with ONLY JSON: {"name":"short meal name","food_term":"one generic food name","items":[{"name":"generic food name, e.g. chicken shawarma","grams":number,"confidence":number,"ingredients":[string],"est":{"kcal":number,"protein":number,"carbs":number,"fat":number,"fiber":number,"sugar":number}}]}. est covers the whole portion of that item.`}];
 if(dr.big&&(vf||db.cfg.prov!='device'))parts.push({img:dr.big});const o=JSON.parse((await ai(parts,1,vf)).match(/\{[\s\S]*\}/)[0]);m.textContent='Agent 2: matching nutrition database…';
 const T={k:0,p:0,c:0,f:0,fi:0,su:0},rep=[];
 for(const it of o.items||[]){const g=+it.grams||100;let n=lookup(it.name),src='database';if(!n){n=await offLookup(it.name);src='Open Food Facts'}let v;
  if(n)v=n.map(x=>x*g/100);else{const e=it.est||{};v=[e.kcal,e.protein,e.carbs,e.fat,e.fiber,e.sugar].map(x=>+x||0);src='AI estimate'}
  T.k+=v[0];T.p+=v[1];T.c+=v[2];T.f+=v[3];T.fi+=v[4];T.su+=v[5];rep.push(`${it.name} · ${g} g · ${Math.round(v[0])} kcal · ${Math.round((+it.confidence||0)*100)}% sure · ${src}`)}
 if(!T.k)throw Error('No foods identified');return{name:o.name,term:o.food_term,...T,report:rep.join('\n')}}
async function single(note){const parts=[{text:'You are a nutrition expert. Estimate the nutrition of this meal'+(note?` using this description: "${note}"`:'')+'. Estimate the full portion. Reply with ONLY JSON: {"name":string,"food_term":string (one generic common food name),"kcal":number,"protein":number,"carbs":number,"fat":number,"fiber":number,"sugar":number}. Grams for macros.'}];
 if(dr.big&&db.cfg.prov!='device')parts.push({img:dr.big});const o=JSON.parse((await ai(parts,1)).match(/\{[\s\S]*\}/)[0]);return{name:o.name,term:o.food_term,k:o.kcal,p:o.protein,c:o.carbs,f:o.fat,fi:o.fiber,su:o.sugar}}
